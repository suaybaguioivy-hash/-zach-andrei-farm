name: iOS Build - Zach Andrei Farm
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download real game from Share link
        run: |
          mkdir -p dist
          curl -L "https://www.meta.ai/share/a/ff6807a5-f51b-4f07-9029-159f0b2330a3" -o dist/index.html
          ls -lh dist/index.html
          wc -c dist/index.html
      - name: Install deps
        run: npm install
      - name: Sync iOS
        run: |
          npx cap sync ios || npx cap add ios && npx cap sync ios
      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: Zach-Andrei-Farm-iOS-App
          path: ios/App
