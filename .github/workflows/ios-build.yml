name: iOS Build - Zach Andrei Farm
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use uploaded game file
        run: |
          mkdir -p dist
          ls -la
          GAME=$(find . -maxdepth 1 -name "*.html*" -type f | head -n 1)
          echo "Found game file: $GAME"
          if [ -z "$GAME" ]; then echo "NO GAME FILE FOUND"; exit 1; fi
          cp "$GAME" dist/index.html
          ls -lh dist/index.html
          wc -c dist/index.html
      - name: Install deps
        run: |
          rm -rf node_modules package-lock.json
          npm init -y || true
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/ios@8 --legacy-peer-deps
          npm install capacitor-plugin-cdv-purchase --legacy-peer-deps
      - name: Init Capacitor
        run: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.mjs capacitor.config.json
          npx cap init "Zach Andrei Farm" com.zachandrei.farm --web-dir=dist
          ls -la capacitor.*
          cat capacitor.config.ts
      - name: Sync iOS - fresh
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          echo "=== ios/App ==="
          ls -la ios/App || echo "NO ios/App"
      - name: Build iOS App
        run: |
          cd ios/App
          ls -la
          if [ -f "App.xcworkspace" ]; then
            echo "Building with workspace"
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          else
            echo "Building with project - SPM mode"
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          fi
      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: Zach-Andrei-Farm-iOS-App
          path: ios/App/build/Release-iphonesimulator/App.app
