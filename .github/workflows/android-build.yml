name: Android Build - Zach Andrei Farm
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use uploaded game file
        run: |
          mkdir -p dist
          ls -la
          GAME=$(find . -maxdepth 1 -name "*.html*" -type f | head -n 1)
          echo "Found game file: $GAME"
          if [ -z "$GAME" ]; then echo "NO GAME FILE FOUND"; exit 1; fi
          cp "$GAME" dist/index.html
          ls -lh dist/index.html
          wc -c dist/index.html
      - name: Install deps
        run: |
          rm -rf node_modules package-lock.json
          npm init -y || true
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 --legacy-peer-deps
          npm install capacitor-plugin-cdv-purchase --legacy-peer-deps
      - name: Sync Android - fresh
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon --stacktrace
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Zach-Andrei-Farm-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
