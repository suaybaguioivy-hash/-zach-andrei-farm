name: Android Build - Zach Andrei Farm
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use uploaded game file
        run: |
          mkdir -p dist
          ls -la
          GAME=$(find . -maxdepth 1 -name "*.html*" -type f -exec ls -S {} + | head -n 1 | awk '{print $NF}')
          echo "Found game file: $GAME"
          cp "$GAME" dist/index.html
          ls -lh dist/index.html
          wc -c dist/index.html
      - name: Install deps
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 --legacy-peer-deps
          npm install @capacitor-community/google-play-billing@6.0.0 --legacy-peer-deps
      - name: Sync Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          rm -rf ~/.gradle/caches/jars-9
          ./gradlew clean bundleRelease --no-daemon
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Zach-Andrei-Farm-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
