name: iOS Build - Zach Andrei Farm
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use uploaded game file
        run: |
          mkdir -p dist
          ls -la
          GAME=$(find . -maxdepth 1 -name "*.html*" -type f | head -n 1)
          echo "Found game file: $GAME"
          if [ -z "$GAME" ]; then echo "NO GAME FILE FOUND"; exit 1; fi
          cp "$GAME" dist/index.html
          ls -lh dist/index.html
          wc -c dist/index.html
      - name: Install deps
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/ios@6.2.0 --legacy-peer-deps
          npm install capacitor-plugin-cdv-purchase --legacy-peer-deps
      - name: Sync iOS
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -allowProvisioningUpdates -destination "generic/platform=iOS" build CODE_SIGNING_ALLOWED=NO || xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos build CODE_SIGNING_ALLOWED=NO
      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: Zach-Andrei-Farm-iOS-App
          path: ios/App/build/Release-iphoneos/App.app
